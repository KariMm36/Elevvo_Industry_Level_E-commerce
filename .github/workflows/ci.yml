name: CI/CD Pipeline & Zero-Downtime Cloud Deployment

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-typecheck:
    name: 🔍 Lint & TypeCheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: TypeCheck (tsc --noEmit)
        run: npx tsc --noEmit

      - name: ESLint Code Quality Gate
        run: npm run lint

  test:
    name: 🧪 Automated Supertest & Unit Suites
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ecommerce_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ecommerce_test?schema=public
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      JWT_SECRET: test-jwt-secret-key-12345
      JWT_EXPIRES_IN: 1d
      NODE_ENV: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run database schema sync
        run: npx prisma db push

      - name: Run Unit Tests
        run: npm test

      - name: Run End-to-End Supertest Suite
        run: npm run test:e2e

  build-docker:
    name: 🐳 Multi-Stage Docker Packaging
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Production Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: ecommerce-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-production:
    name: 🚀 Zero-Downtime Cloud Deployment
    runs-on: ubuntu-latest
    needs: [build-docker]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies for migration
        run: npm ci

      # Execute Prisma migrations safely against the cloud database using GitHub Secret
      - name: 🐘 Apply Database Migrations to Cloud PostgreSQL
        run: npx prisma db push --skip-generate
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}

      # Trigger zero-downtime rolling update via Render / Railway / Cloud Webhook
      - name: 🌐 Trigger Cloud Provider Zero-Downtime Deployment
        if: env.DEPLOY_HOOK != ''
        run: |
          echo "Triggering zero-downtime rolling deployment..."
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}

      - name: 📋 Deployment Summary
        run: |
          echo "=========================================================="
          echo "✅ Production Deployment Pipeline Succeeded!"
          echo "🚀 Commit SHA : ${{ github.sha }}"
          echo "🛡️ Secrets    : All credentials safely loaded from GitHub Secrets"
          echo "=========================================================="
